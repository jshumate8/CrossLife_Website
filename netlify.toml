[[headers]]
  for = "/study.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/watch.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/evangelism.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[build]
  publish = "."
  
[context.production]
  environment = { NODE_VERSION = "18" }
