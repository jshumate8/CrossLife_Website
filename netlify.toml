[[headers]]
  for = "/study.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/watch.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/share.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/course.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/lesson.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/studies/*/*.md"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/studies/*/course.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[build]
  publish = "."
  command = "" # No build command needed - static site only
  
[build.processing]
  skip_processing = false # Set to true if you want to skip all asset optimization

[context.production]
  environment = { NODE_VERSION = "18" }
