[[headers]]
  for = "/studies.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/teachings.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/resources.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[build]
  publish = "."
  
[context.production]
  environment = { NODE_VERSION = "18" }
