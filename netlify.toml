[[headers]]
  for = "/study.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/watch.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/share.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/course.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/lesson.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[build]
  publish = "."
  command = "" # No build command needed - static site only
  ignore = "exit 0" # Always deploy (or use "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ." to skip if no changes)
  
[build.processing]
  skip_processing = false # Set to true if you want to skip all asset optimization

[context.production]
  environment = { NODE_VERSION = "18" }
